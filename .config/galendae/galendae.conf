# Window settings
## Stick window to all workspaces: 0=No, 1=Yes
stick=0

## Undecorated window: 0=No, 1=Yes
undecorated=0

## Close the window if it loses focus: 0=No, 1=Yes
close_on_unfocus=1

## Initial window position: 'center', 'mouse' or 'none'
position=none

## Move the window horizontally from its initial position
x_offset=0

## Move the window vertically from its initial position
y_offset=0

# Colors (CSS format)
## Window background
background_color=#000000

## Text color
foreground_color=#e0e0e0

## Dates of previous and following months
fringe_date_color=#6e6e70

## Highlight color for the current date
highlight_color=#b8d9ae

# Fonts (CSS size and weight)
## Month font
month_font_size=x-large
month_font_weight=normal

## Weekday column header font
day_font_size=1.0em
day_font_weight=normal

## Date number font
date_font_size=large
date_font_weight=bold

## Arrow font (i.e., '<' and '>')
arrow_font_size=xx-large
arrow_font_weight=bold

# Calendar settings
## Week start day
## Sunday=0, Monday=1, Tuesday=2, Wednesday=3
## Thursday=4, Friday=5, Saturday=6
week_start=1

